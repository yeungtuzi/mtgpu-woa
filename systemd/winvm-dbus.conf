<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Private bus that carries QEMU's dbus display protocol.
     Both root (QEMU) and the desktop user (viewer) must be able to
     connect, which the stock session config does not allow. -->
<busconfig>
  <type>custom</type>
  <listen>unix:path=/run/winvm-dbus/bus</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow eavesdrop="true"/>
  </policy>
</busconfig>
